    - 'printf "OPENAI_API_KEY=%s\n" "${OPENAI_API_KEY}" >> .env'
    - 'printf "DB_URL=%s\n" "${DB_URL}" >> .env'
    - 'printf "LOCAL_API_URL=%s\n" "${LOCAL_API_URL}" >> .env'
    - 'printf "REDIS_URL=%s\n" "${REDIS_URL}" >> .env'
    - 'printf "TELEGRAM_BOT_TOKEN=%s\n" "${TELEGRAM_BOT_TOKEN}" >> .env'
    - chmod 600 .env
    - 'if [ "${FORCE_S3_REFRESH}" = "1" ]; then docker-compose down -v --remove-orphans || true; else docker-compose down --remove-orphans || true; fi'
    - docker-compose up -d --build
    - 'shred -u .env || rm -f .env || true'

deploy-golang-test:

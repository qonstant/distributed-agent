    - cd golang
    - docker build --no-cache -t "${GOLANG_IMAGE_NAME}" .

build-golang-image-test:
  stage: build
  tags:
    - vps2-test
  before_script: *before-vps2
  rules:
    - if: '$CI_COMMIT_BRANCH == "test"'

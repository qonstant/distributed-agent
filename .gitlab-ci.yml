    - 'printf "REDIS_URL=%s\n" "${REDIS_URL_TEST}" >> .env'
    - 'printf "RABBITMQ_URL=%s\n" "${RABBITMQ_URL_TEST}" >> .env'
    - 'printf "TELEGRAM_BOT_TOKEN=%s\n" "${TELEGRAM_BOT_TOKEN_TEST}" >> .env'
    - chmod 600 .env
    - 'if [ "${FORCE_S3_REFRESH}" = "1" ]; then docker-compose down -v --remove-orphans || true; else docker-compose down --remove-orphans || true; fi'
    - docker-compose up -d --build
    - 'shred -u .env || rm -f .env || true'

prepare-golang-db-files-prod:
  stage: deploy
  tags:
    - vps2
  before_script: *before-vps2
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - mkdir -p /opt/golang-db
    - rm -rf /opt/golang-db/migrations
    - cp golang/docker-compose.db.yml /opt/golang-db/
    - cp -r golang/db/migrations /opt/golang-db/migrations
    - cp Makefile /opt/golang-db/
    - sed -i 's|^DB_COMPOSE_FILE := .*|DB_COMPOSE_FILE := docker-compose.db.yml|' /opt/golang-db/Makefile
    - sed -i 's|^MIGRATIONS_PATH := .*|MIGRATIONS_PATH := migrations|' /opt/golang-db/Makefile
    - 'printf "POSTGRES_SUPERUSER_PASSWORD=%s\n" "${POSTGRES_SUPERUSER_PASSWORD}" > /opt/golang-db/.env'
    - 'printf "DB_URL=%s\n" "${DB_URL}" >> /opt/golang-db/.env'
    - chmod 600 /opt/golang-db/.env
    - echo "Copied DB files to /opt/golang-db"
    - find /opt/golang-db -maxdepth 3 -type f | sort

prepare-golang-db-files-test:
  stage: deploy
  tags:
    - vps2-test
  before_script: *before-vps2
  rules:
    - if: '$CI_COMMIT_BRANCH == "test"'
  script:
    - mkdir -p /opt/golang-db

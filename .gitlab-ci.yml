    - 'printf "ADMIN_CONTAINER_NAME=%s\n" "${ADMIN_CONTAINER_NAME}" >> .env'
    - 'printf "ADMIN_BIND_HOST=%s\n" "${ADMIN_BIND_HOST_TEST:-127.0.0.1}" >> .env'

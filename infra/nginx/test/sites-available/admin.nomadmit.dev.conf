server {
    if ($host = admin.nomadmit.dev) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name admin.nomadmit.dev;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name admin.nomadmit.dev;

    allow 10.66.66.0/24;
    deny all;
    ssl_certificate /etc/letsencrypt/live/admin.nomadmit.dev/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/admin.nomadmit.dev/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:3910;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

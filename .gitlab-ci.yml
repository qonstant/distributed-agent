    - 'printf "S3_ACCESS_KEY_ID=%s\n" "${S3_ACCESS_KEY_ID_TEST}" >> .env'
    - 'printf "S3_SECRET_ACCESS_KEY=%s\n" "${S3_SECRET_ACCESS_KEY_TEST}" >> .env'
    - 'printf "OPENAI_API_KEY=%s\n" "${OPENAI_API_KEY_TEST}" >> .env'
    - 'printf "DB_URL=%s\n" "${DB_URL_TEST}" >> .env'
    - 'printf "LOCAL_API_URL=%s\n" "${LOCAL_API_URL_TEST}" >> .env'
    - 'printf "REDIS_URL=%s\n" "${REDIS_URL_TEST}" >> .env'

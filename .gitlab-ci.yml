stages:
  - test
  - build
  - deploy

# small before_script anchors
.before-vps1: &before-vps1
  - echo "Running on $(hostname)"
  - docker --version || true
  - docker-compose --version || true
  - export DOCKER_MAINTENANCE_LOCK="${DOCKER_MAINTENANCE_LOCK:-/var/lock/docker-maintenance.lock}"
  - exec 9>"${DOCKER_MAINTENANCE_LOCK}"
  - flock 9
  - echo "Acquired Docker maintenance lock: ${DOCKER_MAINTENANCE_LOCK}"

.before-vps2: &before-vps2
  - echo "Running on $(hostname) (golang runner)"
  - docker --version || true
  - docker-compose --version || true
  - export DOCKER_MAINTENANCE_LOCK="${DOCKER_MAINTENANCE_LOCK:-/var/lock/docker-maintenance.lock}"
  - exec 9>"${DOCKER_MAINTENANCE_LOCK}"
  - flock 9
  - echo "Acquired Docker maintenance lock: ${DOCKER_MAINTENANCE_LOCK}"

variables:
  IMAGE_NAME: "rag:latest"
  CONTAINER_NAME: "rag-container"
  BOT_IMAGE_NAME: "study-bot:latest"
  BOT_CONTAINER_NAME: "study-bot"
  GOLANG_IMAGE_NAME: "golang-agent:latest"
  GOLANG_CONTAINER_NAME: "golang-agent"
  ADMIN_IMAGE_NAME: "admin-panel:latest"
  ADMIN_CONTAINER_NAME: "admin-panel"
  LANDING_IMAGE_NAME: "landing-page:latest"
  LANDING_CONTAINER_NAME: "landing-page"
  # Generated RAG/LightRAG outputs can be written by containers on the VPS.
  # Do not let git clean fail the whole pipeline on root-owned generated files.
  GIT_CLEAN_FLAGS: "-ffdx -e python/RAG/out/ -e python/rag_api/**/__pycache__/"

test-landing-prod:
  stage: test
  tags:
    - vps1
  before_script: *before-vps1
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      exists:
        - frontend/landing-page/package.json
  script:
    - |
      docker run --rm \
        -v "$PWD:/workspace" \
        -w /workspace/frontend/landing-page \
        --user "$(id -u):$(id -g)" \
        -e HOME=/tmp \
        -e PNPM_HOME=/tmp/pnpm \
        node:22-alpine \
        sh -lc 'corepack pnpm config set store-dir /tmp/.pnpm-store && corepack pnpm install --frozen-lockfile && corepack pnpm exec tsc --noEmit && corepack pnpm build'

test-landing-test:
  stage: test
  tags:
    - vps1-test
  before_script: *before-vps1
  rules:
    - if: '$CI_COMMIT_BRANCH == "test"'
      exists:
        - frontend/landing-page/package.json
  script:
    - |
      docker run --rm \
        -v "$PWD:/workspace" \
        -w /workspace/frontend/landing-page \
        --user "$(id -u):$(id -g)" \
        -e HOME=/tmp \
        -e PNPM_HOME=/tmp/pnpm \
        node:22-alpine \
        sh -lc 'corepack pnpm config set store-dir /tmp/.pnpm-store && corepack pnpm install --frozen-lockfile && corepack pnpm exec tsc --noEmit && corepack pnpm build'

test-golang-prod:
  stage: test
  tags:
    - vps2
  before_script: *before-vps2
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - make test-docker

test-golang-test:
  stage: test
  tags:
    - vps2-test
  before_script: *before-vps2
  rules:
    - if: '$CI_COMMIT_BRANCH == "test"'
  script:
    - make test-docker

################################################################################
# RAG (python/rag_api)
################################################################################
build-rag-image-prod:
  stage: build
  tags:
    - vps1
  before_script: *before-vps1
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - cd python/rag_api
    - docker build --no-cache -t "${IMAGE_NAME}" .

build-rag-image-test:
  stage: build
  tags:
    - vps1-test
  before_script: *before-vps1
  rules:
    - if: '$CI_COMMIT_BRANCH == "test"'
  script:
    - cd python/rag_api
    - docker build --no-cache -t "${IMAGE_NAME}" .

deploy-rag-prod:
  stage: deploy
  tags:
    - vps1
  before_script: *before-vps1
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - cd python/rag_api
    - 'echo "OPENAI_API_KEY set? ${OPENAI_API_KEY:+yes}"'
    - 'echo "OPENAI_API_KEY length: ${#OPENAI_API_KEY}"'
    - 'echo "REDIS_URL set? ${REDIS_URL:+yes}"'
    - 'printf "OPENAI_API_KEY=%s\n" "${OPENAI_API_KEY}" > .env'
    - 'printf "REDIS_URL=%s\n" "${REDIS_URL}" >> .env'
    - 'printf "S3_ENDPOINT=%s\n" "${S3_ENDPOINT}" >> .env'
    - 'printf "S3_BUCKET_VECTORS=%s\n" "${S3_BUCKET_VECTORS}" >> .env'
    - 'printf "S3_ACCESS_KEY_ID=%s\n" "${S3_ACCESS_KEY_ID}" >> .env'
    - 'printf "S3_SECRET_ACCESS_KEY=%s\n" "${S3_SECRET_ACCESS_KEY}" >> .env'
    - 'printf "S3_USE_SSL=%s\n" "${S3_USE_SSL}" >> .env'
    - 'printf "S3_VERIFY=%s\n" "${S3_VERIFY}" >> .env'
    - 'printf "RELEASE_PREFIX=%s\n" "${RELEASE_PREFIX}" >> .env'
    - 'printf "RAG_RETRIEVAL_BACKEND=%s\n" "${RAG_RETRIEVAL_BACKEND:-lightrag}" >> .env'
    - 'printf "RAG_RETRIEVAL_FALLBACK=%s\n" "${RAG_RETRIEVAL_FALLBACK:-faiss}" >> .env'
    - 'printf "LIGHTRAG_S3_PREFIX=%s\n" "${LIGHTRAG_S3_PREFIX:-lightrag}" >> .env'
    - 'printf "LIGHTRAG_QUERY_MODE=%s\n" "${LIGHTRAG_QUERY_MODE:-naive}" >> .env'
    - chmod 600 .env
    - docker-compose down -v --remove-orphans || true
    - docker-compose up -d --build
    - sleep 3
    - 'docker logs "${CONTAINER_NAME}" --tail 30 || true'
    - |
      docker exec "${CONTAINER_NAME}" python - <<'PY' || true
      import os
      print(f"[rag] REDIS_URL set? {'yes' if os.getenv('REDIS_URL') else 'no'}")
      if os.getenv("REDIS_URL"):
          import redis
          try:
              ok = redis.Redis.from_url(os.environ["REDIS_URL"], decode_responses=True).ping()
              print(f"[rag] redis ping: {ok}")
          except Exception as exc:
              print(f"[rag] redis ping failed: {exc}")
      PY
    - |
      docker exec "${CONTAINER_NAME}" python - <<'PY' || true
      import json
      from collections import Counter
      from pathlib import Path

      meta = json.loads(Path("/app/out/meta.json").read_text())
      counts = Counter((m.get("source_file") or m.get("filename") or "unknown") for m in meta.values())

      print(f"[rag] total chunks: {len(meta)}")
      print(f"[rag] total files: {len(counts)}")
      for name, count in sorted(counts.items()):
          print(f"[rag] {count:3d}  {name}")
      PY
    - 'shred -u .env || rm -f .env || true'

deploy-rag-test:
  stage: deploy
  tags:
    - vps1-test
  before_script: *before-vps1
  rules:
    - if: '$CI_COMMIT_BRANCH == "test"'
  script:
    - cd python/rag_api
    - 'echo "OPENAI_API_KEY_TEST set? ${OPENAI_API_KEY_TEST:+yes}"'
    - 'echo "OPENAI_API_KEY_TEST length: ${#OPENAI_API_KEY_TEST}"'
    - 'echo "REDIS_URL_TEST set? ${REDIS_URL_TEST:+yes}"'
    - 'printf "OPENAI_API_KEY=%s\n" "${OPENAI_API_KEY_TEST}" > .env'
    - 'printf "REDIS_URL=%s\n" "${REDIS_URL_TEST}" >> .env'
    - 'printf "S3_ENDPOINT=%s\n" "${S3_ENDPOINT_TEST}" >> .env'
    - 'printf "S3_BUCKET_VECTORS=%s\n" "${S3_BUCKET_VECTORS_TEST}" >> .env'
    - 'printf "S3_ACCESS_KEY_ID=%s\n" "${S3_ACCESS_KEY_ID_TEST}" >> .env'
    - 'printf "S3_SECRET_ACCESS_KEY=%s\n" "${S3_SECRET_ACCESS_KEY_TEST}" >> .env'
    - 'printf "S3_USE_SSL=%s\n" "${S3_USE_SSL_TEST}" >> .env'
    - 'printf "S3_VERIFY=%s\n" "${S3_VERIFY_TEST}" >> .env'
    - 'printf "RELEASE_PREFIX=%s\n" "${RELEASE_PREFIX_TEST}" >> .env'
    - 'printf "RAG_RETRIEVAL_BACKEND=%s\n" "${RAG_RETRIEVAL_BACKEND_TEST:-lightrag}" >> .env'
    - 'printf "RAG_RETRIEVAL_FALLBACK=%s\n" "${RAG_RETRIEVAL_FALLBACK_TEST:-faiss}" >> .env'
    - 'printf "LIGHTRAG_S3_PREFIX=%s\n" "${LIGHTRAG_S3_PREFIX_TEST:-lightrag}" >> .env'
    - 'printf "LIGHTRAG_QUERY_MODE=%s\n" "${LIGHTRAG_QUERY_MODE_TEST:-naive}" >> .env'
    - chmod 600 .env
    - docker-compose down -v --remove-orphans || true
    - docker-compose up -d --build
    - sleep 3
    - 'docker logs "${CONTAINER_NAME}" --tail 30 || true'
    - |
      docker exec "${CONTAINER_NAME}" python - <<'PY' || true
      import os
      print(f"[rag] REDIS_URL set? {'yes' if os.getenv('REDIS_URL') else 'no'}")
      if os.getenv("REDIS_URL"):
          import redis
          try:
              ok = redis.Redis.from_url(os.environ["REDIS_URL"], decode_responses=True).ping()
              print(f"[rag] redis ping: {ok}")
          except Exception as exc:
              print(f"[rag] redis ping failed: {exc}")
      PY
    - |
      docker exec "${CONTAINER_NAME}" python - <<'PY' || true
      import json
      from collections import Counter
      from pathlib import Path

      meta = json.loads(Path("/app/out/meta.json").read_text())
      counts = Counter((m.get("source_file") or m.get("filename") or "unknown") for m in meta.values())

      print(f"[rag] total chunks: {len(meta)}")
      print(f"[rag] total files: {len(counts)}")
      for name, count in sorted(counts.items()):
          print(f"[rag] {count:3d}  {name}")
      PY
    - 'shred -u .env || rm -f .env || true'

################################################################################
# LANDING PAGE (frontend/landing-page)
################################################################################
build-landing-image-prod:
  stage: build
  tags:
    - vps1
  before_script: *before-vps1
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      exists:
        - frontend/landing-page/Dockerfile
        - frontend/landing-page/docker-compose.yml
  script:
    - cd frontend/landing-page
    - 'LANDING_DEPLOY_IMAGE="landing-page:${CI_COMMIT_SHORT_SHA}"'
    - 'docker build --no-cache --build-arg NEXT_PUBLIC_SCRIPT_URL="${LANDING_NEXT_PUBLIC_SCRIPT_URL:-}" --label app=landing-page --label git_sha="${CI_COMMIT_SHA}" -t "${LANDING_DEPLOY_IMAGE}" .'

build-landing-image-test:
  stage: build
  tags:
    - vps1-test
  before_script: *before-vps1
  rules:
    - if: '$CI_COMMIT_BRANCH == "test"'
      exists:
        - frontend/landing-page/Dockerfile
        - frontend/landing-page/docker-compose.yml
  script:
    - cd frontend/landing-page
    - 'LANDING_DEPLOY_IMAGE="landing-page:test-${CI_COMMIT_SHORT_SHA}"'
    - 'docker build --no-cache --build-arg NEXT_PUBLIC_SCRIPT_URL="${LANDING_NEXT_PUBLIC_SCRIPT_URL_TEST:-}" --label app=landing-page --label git_sha="${CI_COMMIT_SHA}" -t "${LANDING_DEPLOY_IMAGE}" .'

deploy-landing-prod:
  stage: deploy
  tags:
    - vps1
  before_script: *before-vps1
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      exists:
        - frontend/landing-page/Dockerfile
        - frontend/landing-page/docker-compose.yml
  script:
    - cd frontend/landing-page
    - 'LANDING_DEPLOY_IMAGE="landing-page:${CI_COMMIT_SHORT_SHA}"'
    - 'export LANDING_IMAGE_NAME="${LANDING_DEPLOY_IMAGE}"'
    - 'export LANDING_CONTAINER_NAME="${LANDING_CONTAINER_NAME:-landing-page}"'
    - 'export LANDING_BIND_HOST="${LANDING_BIND_HOST:-127.0.0.1}"'
    - 'export LANDING_HOST_PORT="${LANDING_HOST_PORT:-3000}"'
    - 'export NEXT_PUBLIC_SCRIPT_URL="${LANDING_NEXT_PUBLIC_SCRIPT_URL:-}"'
    - 'printf "LANDING_IMAGE_NAME=%s\n" "${LANDING_IMAGE_NAME}" > .env'
    - 'printf "LANDING_CONTAINER_NAME=%s\n" "${LANDING_CONTAINER_NAME}" >> .env'
    - 'printf "LANDING_BIND_HOST=%s\n" "${LANDING_BIND_HOST}" >> .env'
    - 'printf "LANDING_HOST_PORT=%s\n" "${LANDING_HOST_PORT}" >> .env'
    - 'printf "NEXT_PUBLIC_SCRIPT_URL=%s\n" "${NEXT_PUBLIC_SCRIPT_URL}" >> .env'
    - chmod 600 .env
    - 'docker image inspect "${LANDING_IMAGE_NAME}" >/dev/null 2>&1 || (echo "Missing built image: ${LANDING_IMAGE_NAME}" && exit 1)'
    - docker-compose down --remove-orphans || true
    - docker-compose up -d --no-build web
    - sleep 3
    - 'docker logs "${LANDING_CONTAINER_NAME}" --tail 30 || true'
    - 'docker exec "${LANDING_CONTAINER_NAME}" node -e "fetch(''http://127.0.0.1:3000/api/health'').then((res)=>res.text()).then((body)=>console.log(body)).catch((err)=>{console.error(err); process.exit(1)})"'
    - docker image prune -a -f --filter "label=app=landing-page" --filter "until=168h" || true
    - 'shred -u .env || rm -f .env || true'

deploy-landing-test:
  stage: deploy
  tags:
    - vps1-test
  before_script: *before-vps1
  rules:
    - if: '$CI_COMMIT_BRANCH == "test"'
      exists:
        - frontend/landing-page/Dockerfile
        - frontend/landing-page/docker-compose.yml
  script:
    - cd frontend/landing-page

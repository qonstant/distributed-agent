    - sleep 3
    - 'docker logs "${ADMIN_CONTAINER_NAME}" --tail 30 || true'
    - 'docker exec "${ADMIN_CONTAINER_NAME}" python -c "import urllib.request; print(urllib.request.urlopen(''http://127.0.0.1:8000/health'', timeout=3).read().decode())" || true'
    - 'shred -u .env || rm -f .env || true'
    


services:
  db:
    image: postgres:15
    profiles:
      - local
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-telegram_access}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "${ADMIN_DB_BIND_HOST:-127.0.0.1}:${ADMIN_DB_HOST_PORT:-5432}:5432"

  web:
    image: ${ADMIN_IMAGE_NAME:-admin-panel:latest}
    container_name: ${ADMIN_CONTAINER_NAME:-admin-panel}
    build: .
    restart: unless-stopped
    env_file:
      - .env
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips=*
    ports:
      - "${ADMIN_BIND_HOST:-127.0.0.1}:${ADMIN_HOST_PORT:-3910}:8000"
    volumes:
      - ${LIGHTRAG_REPO_MOUNT:-../..}:/workspace/distributed-agent
    environment:
      - APP_ENV=${APP_ENV:-development}
      - DATABASE_URL=${DATABASE_URL}
      - SECRET_KEY=${SECRET_KEY}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      - ALGORITHM=${ALGORITHM:-HS256}
      - ADMIN_USERNAME=${ADMIN_USERNAME}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - ADMIN_COOKIE_SECURE=${ADMIN_COOKIE_SECURE:-false}
      - CORS_ALLOW_ORIGINS=${CORS_ALLOW_ORIGINS:-*}
      - LIGHTRAG_REPO_DIR=${LIGHTRAG_REPO_DIR:-/workspace/distributed-agent}
      - LIGHTRAG_WORK_DIR=${LIGHTRAG_WORK_DIR:-/tmp/nomadmit-lightrag-work}
      - LIGHTRAG_BUILD_FULL_COMMAND=${LIGHTRAG_BUILD_FULL_COMMAND:-make lightrag-s3-full PYTHON=/opt/lightrag-venv/bin/python}
      - LIGHTRAG_BUILD_CONTINUE_COMMAND=${LIGHTRAG_BUILD_CONTINUE_COMMAND:-make lightrag-s3-continue PYTHON=/opt/lightrag-venv/bin/python}
      - LIGHTRAG_UPLOAD_ENABLED=${LIGHTRAG_UPLOAD_ENABLED:-true}
      - LIGHTRAG_CLEAN_LOCAL_AFTER_UPLOAD=${LIGHTRAG_CLEAN_LOCAL_AFTER_UPLOAD:-true}
      - LIGHTRAG_S3_PREFIX=${LIGHTRAG_S3_PREFIX:-lightrag}
      - LIGHTRAG_SOURCE_PREFIX=italy
      - LIGHTRAG_MARKDOWN_S3_PREFIX=markdowns
      - LIGHTRAG_STRIP_SOURCE_PREFIX=true
      - RAG_DOC_PREFIX=italy
      - S3_ENDPOINT=${S3_ENDPOINT:-}
      - S3_BUCKET=${S3_BUCKET:-}
      - S3_BUCKET_VECTORS=${S3_BUCKET_VECTORS:-}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:-}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:-}
      - S3_USE_SSL=${S3_USE_SSL:-false}
      - S3_VERIFY=${S3_VERIFY:-false}

volumes:
  db_data:

    - 'printf "ACCESS_TOKEN_EXPIRE_MINUTES=%s\n" "${ADMIN_ACCESS_TOKEN_EXPIRE_MINUTES_TEST:-60}" >> .env'
    - 'printf "ALGORITHM=%s\n" "${ADMIN_ALGORITHM_TEST:-HS256}" >> .env'

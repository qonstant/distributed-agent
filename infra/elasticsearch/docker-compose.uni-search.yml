services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${UNI_ES_VERSION}
    container_name: uni-search-elasticsearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "true"
      ELASTIC_PASSWORD: ${UNI_ES_PASSWORD}
      ES_JAVA_OPTS: ${UNI_ES_JAVA_OPTS}
      bootstrap.memory_lock: "true"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "127.0.0.1:${UNI_ES_HTTP_PORT}:9200"
    volumes:
      - ${UNI_ES_DATA_DIR:-./data}:/usr/share/elasticsearch/data

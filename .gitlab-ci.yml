# ADMIN PANEL (frontend/admin)
################################################################################
build-admin-image-prod:
  stage: build
  tags:
    - vps2
  before_script: *before-vps2
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      exists:
        - frontend/admin/Dockerfile
        - frontend/admin/docker-compose.yml
  script:
    - cd frontend/admin
    - 'ADMIN_DEPLOY_IMAGE="admin-panel:${CI_COMMIT_SHORT_SHA}"'
    - docker build --no-cache --label app=admin-panel --label git_sha="${CI_COMMIT_SHA}" -t "${ADMIN_DEPLOY_IMAGE}" .

build-admin-image-test:
  stage: build
  tags:
    - vps2-test
  before_script: *before-vps2
  rules:
    - if: '$CI_COMMIT_BRANCH == "test"'
      exists:
        - frontend/admin/Dockerfile
        - frontend/admin/docker-compose.yml
  script:
    - cd frontend/admin
    - 'ADMIN_DEPLOY_IMAGE="admin-panel:test-${CI_COMMIT_SHORT_SHA}"'
    - docker build --no-cache --label app=admin-panel --label git_sha="${CI_COMMIT_SHA}" -t "${ADMIN_DEPLOY_IMAGE}" .

deploy-admin-prod:
  stage: deploy
  tags:
    - vps2
  before_script: *before-vps2
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      exists:
        - frontend/admin/Dockerfile
        - frontend/admin/docker-compose.yml
  script:
    - cd frontend/admin
    - 'ADMIN_DEPLOY_IMAGE="admin-panel:${CI_COMMIT_SHORT_SHA}"'
    - 'test -n "${ADMIN_DATABASE_URL}" || (echo "ADMIN_DATABASE_URL is not set" && exit 1)'
    - 'test -n "${ADMIN_SECRET_KEY}" || (echo "ADMIN_SECRET_KEY is not set" && exit 1)'
    - 'test -n "${ADMIN_USERNAME}" || (echo "ADMIN_USERNAME is not set" && exit 1)'
    - 'test -n "${ADMIN_PASSWORD}" || (echo "ADMIN_PASSWORD is not set" && exit 1)'
    - 'test -n "${ADMIN_TELEGRAM_ID}" || (echo "ADMIN_TELEGRAM_ID is not set" && exit 1)'
    - 'export ADMIN_IMAGE_NAME="${ADMIN_DEPLOY_IMAGE}"'
    - 'export ADMIN_CONTAINER_NAME="${ADMIN_CONTAINER_NAME:-admin-panel}"'
    - 'export ADMIN_BIND_HOST="${ADMIN_BIND_HOST:-127.0.0.1}"'
    - 'export ADMIN_HOST_PORT="${ADMIN_HOST_PORT:-3910}"'
    - 'printf "APP_ENV=production\n" > .env'
    - 'printf "ADMIN_IMAGE_NAME=%s\n" "${ADMIN_IMAGE_NAME}" >> .env'
    - 'printf "ADMIN_CONTAINER_NAME=%s\n" "${ADMIN_CONTAINER_NAME}" >> .env'
    - 'printf "ADMIN_BIND_HOST=%s\n" "${ADMIN_BIND_HOST}" >> .env'
    - 'printf "ADMIN_HOST_PORT=%s\n" "${ADMIN_HOST_PORT}" >> .env'
    - 'printf "DATABASE_URL=%s\n" "${ADMIN_DATABASE_URL}" >> .env'
    - 'printf "SECRET_KEY=%s\n" "${ADMIN_SECRET_KEY}" >> .env'
    - 'printf "ACCESS_TOKEN_EXPIRE_MINUTES=%s\n" "${ADMIN_ACCESS_TOKEN_EXPIRE_MINUTES:-60}" >> .env'
    - 'printf "ALGORITHM=%s\n" "${ADMIN_ALGORITHM:-HS256}" >> .env'
    - 'printf "ADMIN_USERNAME=%s\n" "${ADMIN_USERNAME}" >> .env'
    - 'printf "ADMIN_PASSWORD=%s\n" "${ADMIN_PASSWORD}" >> .env'
    - 'printf "ADMIN_TELEGRAM_ID=%s\n" "${ADMIN_TELEGRAM_ID}" >> .env'
    - 'printf "ADMIN_COOKIE_SECURE=%s\n" "${ADMIN_COOKIE_SECURE:-true}" >> .env'
    - 'printf "CORS_ALLOW_ORIGINS=%s\n" "${ADMIN_CORS_ORIGINS:-*}" >> .env'
    - 'printf "OPENAI_API_KEY=%s\n" "${OPENAI_API_KEY}" >> .env'
    - 'printf "S3_ENDPOINT=%s\n" "${S3_ENDPOINT}" >> .env'
    - 'printf "S3_BUCKET=%s\n" "${S3_BUCKET}" >> .env'
    - 'printf "S3_BUCKET_VECTORS=%s\n" "${S3_BUCKET_VECTORS}" >> .env'
    - 'printf "S3_ACCESS_KEY_ID=%s\n" "${S3_ACCESS_KEY_ID}" >> .env'
    - 'printf "S3_SECRET_ACCESS_KEY=%s\n" "${S3_SECRET_ACCESS_KEY}" >> .env'
    - 'printf "S3_USE_SSL=%s\n" "${S3_USE_SSL:-false}" >> .env'
    - 'printf "S3_VERIFY=%s\n" "${S3_VERIFY:-false}" >> .env'
    - chmod 600 .env
    - docker run --rm --env-file .env --network host "${ADMIN_DEPLOY_IMAGE}" python scripts/check_schema.py
    - docker run --rm --env-file .env --network host "${ADMIN_DEPLOY_IMAGE}" python scripts/create_admin.py
    - 'docker image inspect "${ADMIN_IMAGE_NAME}" >/dev/null 2>&1 || (echo "Missing built image: ${ADMIN_IMAGE_NAME}" && exit 1)'
    - docker-compose down --remove-orphans || true
    - docker-compose up -d --no-build web
    - sleep 3
    - 'docker logs "${ADMIN_CONTAINER_NAME}" --tail 30 || true'
    - 'docker exec "${ADMIN_CONTAINER_NAME}" sh -lc ''echo "[admin] OPENAI_API_KEY set? ${OPENAI_API_KEY:+yes}"; echo "[admin] S3_ENDPOINT=$S3_ENDPOINT S3_BUCKET=$S3_BUCKET S3_BUCKET_VECTORS=$S3_BUCKET_VECTORS"'' || true'
    - 'docker exec "${ADMIN_CONTAINER_NAME}" python -c "import urllib.request; print(urllib.request.urlopen(''http://127.0.0.1:8000/health'', timeout=3).read().decode())" || true'
    - docker image prune -a -f --filter "label=app=admin-panel" --filter "until=168h" || true
    - 'shred -u .env || rm -f .env || true'


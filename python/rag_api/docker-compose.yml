version: "3.9"

services:
  rag-api:
    image: rag:latest
    container_name: rag-container
    ports:
      - "127.0.0.1:8080:8000"
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - rag_out:/app/out
    restart: unless-stopped

volumes:
  rag_out:

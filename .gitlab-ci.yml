stages:
  - test
  - build
  - deploy

# small before_script anchors
.before-vps1: &before-vps1
  - echo "Running on $(hostname)"
  - docker --version || true
  - docker-compose --version || true

.before-vps2: &before-vps2
  - echo "Running on $(hostname) (golang runner)"
  - docker --version || true
  - docker-compose --version || true

variables:
  IMAGE_NAME: "rag:latest"
  CONTAINER_NAME: "rag-container"
  BOT_IMAGE_NAME: "study-bot:latest"
  BOT_CONTAINER_NAME: "study-bot"
  GOLANG_IMAGE_NAME: "golang-agent:latest"
  GOLANG_CONTAINER_NAME: "golang-agent"

test-golang-prod:
  stage: test
  tags:
    - vps2
  before_script: *before-vps2
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - make coverage-docker
  coverage: '/total:\s+\(statements\)\s+(\d+\.\d+)%/'
  artifacts:
    when: always
    paths:
      - golang/coverage.out

test-golang-test:
  stage: test
  tags:
    - vps2-test
  before_script: *before-vps2
  rules:
    - if: '$CI_COMMIT_BRANCH == "test"'
  script:
    - make coverage-docker
  coverage: '/total:\s+\(statements\)\s+(\d+\.\d+)%/'
  artifacts:
    when: always
    paths:
      - golang/coverage.out

################################################################################
# RAG (python/rag_api)
################################################################################
build-rag-image-prod:
  stage: build
  tags:
    - vps1
  before_script: *before-vps1
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - cd python/rag_api
    - docker build --no-cache -t "${IMAGE_NAME}" .

build-rag-image-test:
  stage: build
  tags:
    - vps1-test
  before_script: *before-vps1
  rules:
    - if: '$CI_COMMIT_BRANCH == "test"'
  script:
    - cd python/rag_api
    - docker build --no-cache -t "${IMAGE_NAME}" .

deploy-rag-prod:
  stage: deploy
  tags:
    - vps1
  before_script: *before-vps1
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - cd python/rag_api
    - 'echo "OPENAI_API_KEY set? ${OPENAI_API_KEY:+yes}"'
    - 'echo "OPENAI_API_KEY length: ${#OPENAI_API_KEY}"'
    - 'echo "REDIS_URL set? ${REDIS_URL:+yes}"'
    - 'printf "OPENAI_API_KEY=%s\n" "${OPENAI_API_KEY}" > .env'
    - 'printf "REDIS_URL=%s\n" "${REDIS_URL}" >> .env'
    - 'printf "S3_ENDPOINT=%s\n" "${S3_ENDPOINT}" >> .env'
    - 'printf "S3_BUCKET_VECTORS=%s\n" "${S3_BUCKET_VECTORS}" >> .env'
    - 'printf "S3_ACCESS_KEY_ID=%s\n" "${S3_ACCESS_KEY_ID}" >> .env'
    - 'printf "S3_SECRET_ACCESS_KEY=%s\n" "${S3_SECRET_ACCESS_KEY}" >> .env'
    - 'printf "S3_USE_SSL=%s\n" "${S3_USE_SSL}" >> .env'
    - 'printf "S3_VERIFY=%s\n" "${S3_VERIFY}" >> .env'
    - 'printf "RELEASE_PREFIX=%s\n" "${RELEASE_PREFIX}" >> .env'
    - chmod 600 .env
    - docker-compose down -v --remove-orphans || true
    - docker-compose up -d --build
    - sleep 3
    - 'docker logs "${CONTAINER_NAME}" --tail 30 || true'
    - |
      docker exec "${CONTAINER_NAME}" python - <<'PY' || true
      import json
      from collections import Counter
      from pathlib import Path

      meta = json.loads(Path("/app/out/meta.json").read_text())
      counts = Counter((m.get("source_file") or m.get("filename") or "unknown") for m in meta.values())

      print(f"[rag] total chunks: {len(meta)}")
      print(f"[rag] total files: {len(counts)}")
      for name, count in sorted(counts.items()):
          print(f"[rag] {count:3d}  {name}")
      PY
    - 'shred -u .env || rm -f .env || true'

deploy-rag-test:
  stage: deploy
  tags:
    - vps1-test
  before_script: *before-vps1
  rules:
    - if: '$CI_COMMIT_BRANCH == "test"'
  script:
    - cd python/rag_api
    - 'echo "OPENAI_API_KEY_TEST set? ${OPENAI_API_KEY_TEST:+yes}"'
    - 'echo "OPENAI_API_KEY_TEST length: ${#OPENAI_API_KEY_TEST}"'
    - 'echo "REDIS_URL_TEST set? ${REDIS_URL_TEST:+yes}"'
    - 'printf "OPENAI_API_KEY=%s\n" "${OPENAI_API_KEY_TEST}" > .env'
    - 'printf "REDIS_URL=%s\n" "${REDIS_URL_TEST}" >> .env'
    - 'printf "S3_ENDPOINT=%s\n" "${S3_ENDPOINT_TEST}" >> .env'
    - 'printf "S3_BUCKET_VECTORS=%s\n" "${S3_BUCKET_VECTORS_TEST}" >> .env'
    - 'printf "S3_ACCESS_KEY_ID=%s\n" "${S3_ACCESS_KEY_ID_TEST}" >> .env'
    - 'printf "S3_SECRET_ACCESS_KEY=%s\n" "${S3_SECRET_ACCESS_KEY_TEST}" >> .env'
    - 'printf "S3_USE_SSL=%s\n" "${S3_USE_SSL_TEST}" >> .env'
    - 'printf "S3_VERIFY=%s\n" "${S3_VERIFY_TEST}" >> .env'
    - 'printf "RELEASE_PREFIX=%s\n" "${RELEASE_PREFIX_TEST}" >> .env'
    - chmod 600 .env
    - docker-compose down -v --remove-orphans || true
    - docker-compose up -d --build
    - sleep 3
    - 'docker logs "${CONTAINER_NAME}" --tail 30 || true'
    - |
      docker exec "${CONTAINER_NAME}" python - <<'PY' || true
      import json
      from collections import Counter
      from pathlib import Path

      meta = json.loads(Path("/app/out/meta.json").read_text())
      counts = Counter((m.get("source_file") or m.get("filename") or "unknown") for m in meta.values())

      print(f"[rag] total chunks: {len(meta)}")
      print(f"[rag] total files: {len(counts)}")
      for name, count in sorted(counts.items()):
          print(f"[rag] {count:3d}  {name}")
      PY
    - 'shred -u .env || rm -f .env || true'

